name: build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (compile toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Record JDK 17 home
        run: echo "JDK17=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up JDK 21 (Gradle runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build -Porg.gradle.java.installations.paths="$JDK17"

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: obs-no-more-jars
          path: build/libs/*.jar

  release:
    name: attach jars to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built jars
        uses: actions/download-artifact@v4
        with:
          name: obs-no-more-jars
          path: jars

      - name: Attach jars to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" \
              --notes "Automated build of $TAG." jars/*.jar
          else
            gh release upload "$TAG" jars/*.jar --clobber
          fi
